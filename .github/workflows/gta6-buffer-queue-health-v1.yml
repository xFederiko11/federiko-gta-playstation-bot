name: GTA VI - Buffer X Queue Health (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'buffer_queue_health_v1.py'
      - 'game_photo_policy_v1.py'
      - 'photo_rights_v1.py'
      - 'photo-rights-review-v1.json'
      - 'test_photo_rights_v1.py'
      - 'test_buffer_queue_health_v1.py'
      - 'buffer_slot_reconcile_v1.py'
      - 'test_buffer_slot_reconcile_v1.py'
      - 'buffer_insights_probe_v1.py'
      - 'test_buffer_insights_probe_v1.py'
      - 'launch_delivery_audit_v1.py'
      - 'test_launch_delivery_audit_v1.py'
      - 'editorial_director_v142.py'
      - 'test_editorial_director_v142.py'
      - 'x_automation_safety_v1.py'
      - '.github/workflows/gta6-buffer-queue-health-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta6-buffer-queue-health-v1.yml'
      - 'buffer_queue_health_v1.py'
      - 'buffer_slot_reconcile_v1.py'
      - 'test_buffer_slot_reconcile_v1.py'
      - 'buffer_insights_probe_v1.py'
      - 'test_buffer_insights_probe_v1.py'
      - 'launch_delivery_audit_v1.py'
      - 'test_launch_delivery_audit_v1.py'
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'
    - cron: '17 18 * * *'
    # Campaign-day close (20:42 Rome) to reconcile the final 19:35 slot.
    # GitHub cron is best effort; the report records actual execution time.
    - cron: '42 19 19-30 11 *'
    - cron: '42 19 1-2 12 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta6-buffer-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install public requirements
        run: python -m pip install -r requirements-free.txt
      - name: No-network unit tests and publication gate checks
        run: |
          python -m unittest -q test_photo_rights_v1 test_buffer_queue_health_v1 test_buffer_slot_reconcile_v1 test_buffer_insights_probe_v1 test_launch_delivery_audit_v1 test_editorial_director_v142 test_x_automation_safety_v1
          python x_automation_safety_v1.py
      - name: Read Buffer scheduled sent error and compare today's slots against GitHub ledger
        if: github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_USERNAME: xFederiko11
        run: |
          python buffer_queue_health_v1.py --output previews/buffer-x-health-v1.md
          test -s previews/buffer-x-health-v1.md
          cat previews/buffer-x-health-v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Append independently sourced daily GTA VI launch delivery audit
        if: github.event_name != 'pull_request'
        run: |
          python launch_delivery_audit_v1.py --append-to previews/buffer-x-health-v1.md
          tail -n 20 previews/buffer-x-health-v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Probe Buffer's experimental X insights only once daily (read-only)
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.event.schedule == '17 12 * * *')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_EXPECTED_USERNAME: xFederiko11
        run: |
          python buffer_insights_probe_v1.py --append-to previews/buffer-x-insights-v1.md
          test -s previews/buffer-x-insights-v1.md
          cat previews/buffer-x-insights-v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update dedicated experimental metrics Issue #72
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || github.event.schedule == '17 12 * * *')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit 72 --body-file previews/buffer-x-insights-v1.md
          echo 'Buffer insights diagnostic #72 updated; no X API calls' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep one persistent Buffer health issue #50
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit 50 --body-file previews/buffer-x-health-v1.md
          echo 'Updated Buffer queue health Issue #50' >> "$GITHUB_STEP_SUMMARY"
