name: GTA VI - 55 Trofei SEO Pages v14.2

on:
  pull_request:
    branches: [main]
    paths: ['trophies-gta6-v142.json', 'build_trophy_site_v142.py', 'test_trophies_v142.py', '.github/workflows/trophies-pages-v142.yml']
  push:
    branches: [main]
    paths: ['trophies-gta6-v142.json', 'build_trophy_site_v142.py', '.github/workflows/trophies-pages-v142.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trophies-seo-pages-v142
  cancel-in-progress: false

jobs:
  site-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and verify Italian trophy pages
        run: |
          python build_trophy_site_v142.py
          python -m unittest -q test_trophies_v142
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: site-qa
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy only when GitHub Pages uses Actions source
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
