name: GTA VI - 55 Trofei SEO Pages v14.2

on:
  pull_request:
    branches: [main]
    paths: ['trophies-gta6-v142.json', 'build_trophy_site_v142.py', 'test_trophies_v142.py', '.github/workflows/trophies-pages-v142.yml']
  push:
    branches: [main]
    paths: ['trophies-gta6-v142.json', 'build_trophy_site_v142.py', '.github/workflows/trophies-pages-v142.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trophies-seo-pages-v142
  cancel-in-progress: false

jobs:
  site-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install minimal free test dependencies
        run: python -m pip install "requests>=2.32.4,<3"
      - name: Build and verify Italian trophy pages
        run: |
          python build_trophy_site_v142.py
          python growth_metrics_v142.py
          python -m unittest -q test_trophies_v142 test_editorial_director_v142 test_growth_metrics_v142
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: site-qa
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify that repository Pages deployment is enabled
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-settings.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ] && grep -q '"build_type": "workflow"' /tmp/pages-settings.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "PAGES_NOT_ENABLED: Enable Settings > Pages > Source: GitHub Actions"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy verified SEO pages
        if: steps.enabled.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
