name: GTA VI - Breaking News Watch v13.4

on:
  schedule:
    # GitHub schedules can be delayed. Stop window is enforced by Python.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'preview = no write; run = attempt one verified post'
        required: true
        default: preview
        type: choice
        options: [preview, run]

permissions:
  contents: write

concurrency:
  group: gta-vi-watch-v134
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      LAUNCH_WATCH_V134_AUTOPUBLISH: ${{ vars.LAUNCH_WATCH_V134_AUTOPUBLISH || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install -r requirements-free.txt
          python -m playwright install --with-deps chromium
      - name: Check code
        run: python -m py_compile launch_watch_v134.py buffer_publisher.py rockstar_render.py editorial_v13.py
      - name: Official source preview (manual read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        run: python launch_watch_v134.py --mode preview
      - name: Reserve one verified candidate in repository
        id: reserve
        if: (github.event_name == 'workflow_dispatch' && inputs.action == 'run') || (github.event_name == 'schedule' && vars.LAUNCH_WATCH_V134_AUTOPUBLISH == 'true')
        run: |
          git pull --rebase origin main
          python launch_watch_v134.py --mode reserve
          if [ -f .state/launch-watch-v134.json ]; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f .state/launch-watch-v134.json
            if ! git diff --cached --quiet; then
              git commit -m 'Reserve GTA VI launch alert before Buffer mutation'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Deliver the reserved alert through Buffer
        id: deliver
        if: steps.reserve.outcome == 'success'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python launch_watch_v134.py --mode deliver
      - name: Persist delivery outcome (no automatic retry)
        if: always() && steps.reserve.outcome == 'success'
        run: |
          if [ -f .state/launch-watch-v134.json ]; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f .state/launch-watch-v134.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record GTA VI launch watch Buffer delivery outcome'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
