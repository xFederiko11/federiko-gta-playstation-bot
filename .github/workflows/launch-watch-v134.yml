name: GTA VI - Breaking News Watch v13.4

on:
  schedule:
    # GitHub schedules can be delayed. Stop window is enforced by Python.
    - cron: '2-59/5 * 18-20 11 *'
    - cron: '3-59/15 * 21-30 11 *'
    - cron: '3-59/15 * 1-14 12 *'
  workflow_dispatch:
    inputs:
      action:
        description: 'preview = no write; run = attempt one verified post'
        required: true
        default: preview
        type: choice
        options: [preview, run]

permissions:
  contents: read

concurrency:
  group: gta-vi-watch-v134
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      contents: write
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      LAUNCH_WATCH_V134_AUTOPUBLISH: ${{ vars.LAUNCH_WATCH_V134_AUTOPUBLISH || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-free.txt
      - name: Install Python requirements (cached)
        run: python -m pip install -r requirements-free.txt
      - name: Select preinstalled browser (fallback only when unavailable)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'ROCKSTAR_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
            echo 'Using preinstalled Google Chrome'
          else
            echo 'Preinstalled Chrome missing; using Playwright headless Chromium shell'
            python -m playwright install --with-deps --only-shell chromium
          fi
      - name: Check code
        run: python -m py_compile launch_watch_v134.py buffer_publisher.py rockstar_render.py editorial_v13.py editorial_seo_v135.py
      - name: Official source preview (manual read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        run: python launch_watch_v134.py --mode preview
      - name: Reserve one verified candidate in repository
        id: reserve
        if: (github.event_name == 'workflow_dispatch' && inputs.action == 'run') || (github.event_name == 'schedule' && vars.LAUNCH_WATCH_V134_AUTOPUBLISH == 'true')
        run: |
          git pull --rebase origin main
          python launch_watch_v134.py --mode reserve
          if [ -f .state/launch-watch-v134.json ]; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f .state/launch-watch-v134.json
            if ! git diff --cached --quiet; then
              git commit -m 'Reserve GTA VI launch alert before Buffer mutation'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Deliver the reserved alert through Buffer
        id: deliver
        if: steps.reserve.outcome == 'success'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python launch_watch_v134.py --mode deliver
      - name: Persist delivery outcome (no automatic retry)
        if: always() && steps.reserve.outcome == 'success'
        run: |
          if [ -f .state/launch-watch-v134.json ]; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f .state/launch-watch-v134.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record GTA VI launch watch Buffer delivery outcome'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
