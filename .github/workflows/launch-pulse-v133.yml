name: GTA VI News Center - Launch Pulse v13.3

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'preview: no posts; publish: schedule verified one-time launch pulse'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: write

concurrency:
  group: gta-vi-launch-pulse-v133
  cancel-in-progress: false

jobs:
  pulse:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime
        run: python -m pip install 'requests>=2.31,<3'
      - name: Check before API call
        run: python -m py_compile launch_pulse_v133.py buffer_publisher.py
      - name: Preview or publish launch pulse
        id: dispatch
        continue-on-error: true
        run: python launch_pulse_v133.py --mode '${{ inputs.action }}'
      - name: Persist anti-duplicate ledger even on partial failure
        if: always() && inputs.action == 'publish'
        run: |
          if [ -f .state/launch-pulse-v133.json ]; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f .state/launch-pulse-v133.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record GTA VI launch pulse Buffer requests'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Confirm no partial failure
        if: steps.dispatch.outcome == 'failure'
        run: |
          echo 'Pulse had an error. Inspect the Buffer dashboard; do not blindly rerun.'
          exit 1
