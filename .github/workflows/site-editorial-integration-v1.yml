name: GTA VI - Site editorial integration (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'live_editorial_feed_v1.py'
      - 'test_live_editorial_feed_v1.py'
      - 'game_photo_policy_v1.py'
      - '.github/workflows/site-editorial-integration-v1.yml'
  push:
    branches: [main]
    paths:
      - 'live_editorial_feed_v1.py'
      - 'test_live_editorial_feed_v1.py'
      - 'game_photo_policy_v1.py'
      - '.github/workflows/site-editorial-integration-v1.yml'
  schedule:
    - cron: '52 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta6-reader-feed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-free.txt
      - run: python -m unittest -q test_live_editorial_feed_v1 test_social_media_gate_v2
      - name: Verify deployed site contract, no Buffer access
        if: github.event_name != 'pull_request'
        run: python live_editorial_feed_v1.py
