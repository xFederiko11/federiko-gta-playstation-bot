name: GTA VI - Foto X da revisionare (solo lettura)

on:
  pull_request:
    branches: [main]
    paths:
      - 'photo_review_inbox_v1.py'
      - 'test_photo_review_inbox_v1.py'
      - 'data/photo-intake-known-status-v1.json'
      - '.github/workflows/gta6-photo-review-inbox-v1.yml'
  push:
    branches: [main]
    paths:
      - 'photo_review_inbox_v1.py'
      - 'test_photo_review_inbox_v1.py'
      - 'data/photo-intake-known-status-v1.json'
      - '.github/workflows/gta6-photo-review-inbox-v1.yml'
  schedule:
    - cron: '32 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = no paid X API; scan = only if repository variable explicitly opts in'
        required: true
        default: preview
        type: choice
        options: [preview, scan]

permissions:
  contents: read

concurrency:
  group: gta6-photo-inbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo_inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing free app dependencies (no paid API calls)
        run: python -m pip install -r requirements-free.txt
      - name: Test X intake and fail-closed rights handling
        run: |
          python -m py_compile photo_review_inbox_v1.py test_photo_review_inbox_v1.py
          python -m unittest -q test_photo_review_inbox_v1.py
      - name: Build offline or explicitly opted-in photo review digest
        if: github.event_name != 'pull_request'
        env:
          X_PHOTO_INTAKE_ENABLED: ${{ ((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')) && vars.X_PHOTO_INTAKE_ENABLED || 'false' }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python photo_review_inbox_v1.py --output previews/gta6-photo-review-inbox-v1.md
          test -s previews/gta6-photo-review-inbox-v1.md
          echo 'PS5 photo review: public X links only; no downloading, approval, auto-post or website modification.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$X_PHOTO_INTAKE_ENABLED" = "true" ]; then
            echo 'Opted-in X API search performed: verify actual account billing and limits.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'X API search remains disabled; manual post links in the repository are checked if present.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save read-only review report as workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta6-photo-review-inbox
          path: previews/gta6-photo-review-inbox-v1.md
          retention-days: 7
      - name: Maintain a single editor GitHub review queue issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          X_PHOTO_INTAKE_ENABLED: ${{ ((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')) && vars.X_PHOTO_INTAKE_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          name='GTA VI - Screenshot PS5 da verificare (X)'
          existing="$(gh issue list --repo "$GH_REPO" --state open --search 'in:title GTA VI - Screenshot PS5 da verificare' --json number,title --jq '.[] | select(.title == "GTA VI - Screenshot PS5 da verificare (X)") | .number' | head -n 1)"
          manual="$(python -c "import json;print(len(json.load(open('data/photo-intake-known-status-v1.json'))['posts']))")"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GH_REPO" --title "$name" --body-file previews/gta6-photo-review-inbox-v1.md
            echo "Created a single editor review queue" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$X_PHOTO_INTAKE_ENABLED" = "true" ] || [ "$manual" -gt 0 ]; then
            gh issue edit "$existing" --repo "$GH_REPO" --body-file previews/gta6-photo-review-inbox-v1.md
            echo "Updated editor review queue issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No automatic X API opt-in: preserved the existing review queue unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
