name: GTA VI - Watchdog autonomo

on:
  workflow_dispatch:
  schedule:
    - cron: '12 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta6-autonomous-health-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workflow_health_v1.py'
      - 'test_workflow_health_v1.py'
      - '.github/workflows/gta6-autonomous-health-v1.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: gta6-health-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate independent watchdog
        run: |
          python -m py_compile workflow_health_v1.py
          python workflow_health_v1.py --mode validate
          python -m unittest -q test_workflow_health_v1
      - name: Inspect GitHub Actions and delivery ledger
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python workflow_health_v1.py --mode check
      - name: Open or resolve a single watchdog GitHub issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("previews/gta6-health.json"))["status"])')"
          issue="$(gh issue list --state all --search 'in:title GTA VI - Stato automazioni' --json number,title,state --jq '.[] | select(.title == "GTA VI - Stato automazioni") | .number' | head -n 1)"
          if [ "$status" = "attention" ]; then
            if [ -n "$issue" ]; then
              gh issue reopen "$issue" 2>/dev/null || true
              gh issue edit "$issue" --body-file previews/gta6-health.md
              echo "Watchdog issue #$issue updated" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue create --title 'GTA VI - Stato automazioni' --body-file previews/gta6-health.md
              echo "Watchdog issue created" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'All monitored workflows and recent delivery results are healthy' >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment 'Verifica automatica: monitoraggio tornato regolare.' 2>/dev/null || true
            fi
          fi
      - name: Save watchdog result as short-lived artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta6-autonomous-health
          path: previews/gta6-health.json
          retention-days: 7
