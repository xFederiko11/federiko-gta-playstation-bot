name: Repair editorial regression fixtures 20261120

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-editorial-tests-20261120.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gta-v142-publication-global
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'xFederiko11/federiko-gta-playstation-bot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install existing requirements
        run: python -m pip install -r requirements-free.txt
      - name: Update fixtures without weakening provenance or deduplication
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              if old not in text and new in text:
                  return text
              if text.count(old) != 1:
                  raise RuntimeError('Repair precondition changed: ' + old[:100])
              return text.replace(old, new, 1)
          p = Path('test_site_evergreen_posts_v1.py')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text, '        self.assertEqual(len(calls),1)', '        expected = ["https://xfederiko11.github.io/gta-6" + x["path"] for x in CONTENT]\n        first_live = expected.index(item["url"])\n        self.assertEqual(calls,expected[:first_live+1])')
          p.write_text(text, encoding='utf-8')
          p = Path('test_editorial_autopilot_v137.py')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text, '        self.assertEqual(len(bot.POWERPYX_SPOTLIGHTS), 4)', '        from urllib.parse import urlsplit\n        self.assertGreaterEqual(len(bot.POWERPYX_SPOTLIGHTS), 5)\n        self.assertEqual(len({r["url"] for r in bot.POWERPYX_SPOTLIGHTS}), len(bot.POWERPYX_SPOTLIGHTS))')
          text = replace_once(text, "            self.assertTrue(record['url'].startswith('https://www.powerpyx.com/'))", "            parsed = urlsplit(record['url'])\n            self.assertEqual(parsed.scheme, 'https')\n            self.assertIn(parsed.hostname, ('www.powerpyx.com', 'insider-gaming.com'))\n            self.assertIsNone(parsed.username)\n            self.assertIsNone(parsed.password)\n            source = 'Insider Gaming' if parsed.hostname == 'insider-gaming.com' else 'PowerPyx'")
          text = replace_once(text, "            self.assertIn('PowerPyx', record['text'])", "            self.assertIn(source, record['text'])")
          text = replace_once(text, "        self.assertEqual(first['source'], 'PowerPyx')", "        expected_source = 'Insider Gaming' if urlsplit(first['url']).hostname == 'insider-gaming.com' else 'PowerPyx'\n        self.assertEqual(first['source'], expected_source)")
          text = replace_once(text, "        self.assertIn('\U0001f3c6', first['text'])", "        self.assertIn('GTA VI', first['text'])\n        self.assertIn(expected_source, first['text'])")
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify complete editorial gate before any live publication
        run: |
          python x_automation_safety_v1.py
          python -m unittest -q test_buffer_delivery_receipts_v1 test_site_evergreen_posts_v1 test_editorial_autopilot_v137 test_editorial_language_it test_official_links_free_v140 test_trophies_v142 test_editorial_director_v142 test_quick_tips_v146 test_portal_links_v148 test_buffer_failed_diagnostics_v147 test_buffer_status_summary_v151
      - name: Commit only repaired regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test_site_evergreen_posts_v1.py test_editorial_autopilot_v137.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix stale editorial source and first-live-page test fixtures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Run existing guarded editorial workflow once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run gta6-editorial-autopilot-v137.yml --ref main -f action=run
