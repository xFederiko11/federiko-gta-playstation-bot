name: Verify repaired public guides 20261120

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-editorial-tests-20261120.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'xFederiko11/federiko-gta-playstation-bot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check deployed content rather than build status alone
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          base='https://xfederiko11.github.io/gta-6/guide-e-tutorial/'
          for slug in ('soldi-facili-capitolo-1','soldi-2500-three-sheets-liquor'):
              url=base+slug+'/'
              with urlopen(Request(url,headers={'User-Agent':'GTA6-Site-Health/1.0'}),timeout=20) as r:
                  assert r.status==200
                  assert urlsplit(r.url).hostname=='xfederiko11.github.io'
                  body=r.read(2000000).decode('utf-8')
              assert 'Insider Gaming' in body
              assert 'data-guide-steps="'+slug+'"' in body
              assert 'rel="canonical" href="'+url+'"' in body
              print('LIVE_GUIDE_OK HTTP=200 canonical_and_steps_verified '+url)
          PY
