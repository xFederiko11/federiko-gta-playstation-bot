name: Rockstar Support source regression QA

on:
  pull_request:
    paths:
      - 'sources.py'
      - 'sources.free.json'
      - 'test_rockstar_support_timeout.py'
      - 'rockstar_support_live_probe_v1.py'
      - 'test_rockstar_support_live_probe_v1.py'
      - 'playstation_system.py'
      - 'test_playstation_system.py'
      - 'editorial_autopilot_v137.py'
      - 'test_editorial_autopilot_v137.py'
      - '.github/workflows/rockstar-support-qa.yml'

permissions:
  contents: read

jobs:
  support-timeout-tests:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing free dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-free.txt
      - name: Compile and run Rockstar Support regression tests
        run: |
          python -m py_compile sources.py test_rockstar_support_timeout.py rockstar_support_live_probe_v1.py test_rockstar_support_live_probe_v1.py
          python -m unittest -q test_rockstar_support_timeout.py test_rockstar_support_live_probe_v1.py
      - name: Probe Sony and PowerPyx read-only (no state or Buffer)
        run: |
          python -m unittest -q test_playstation_system test_editorial_autopilot_v137
          timeout 100s python - <<'PY'
          from playstation_system import fetch_system_update
          from editorial_autopilot_v137 import read_feeds, load_sources
          try:
              event = fetch_system_update('PS5', timeout=12)
              print('SONY_SOURCE_PROBE_OK platform=PS5 version=' + event['version'])
          except Exception as exc:
              print('SONY_SOURCE_PROBE_UNAVAILABLE type=' + type(exc).__name__)
          items, errors = read_feeds([s for s in load_sources() if s['name'] == 'PowerPyx'])
          print('POWERPYX_SOURCE_PROBE', 'unavailable' if errors else 'read_ok',
                'items=' + str(len(items)), 'not_a_news_scan')
          PY
      - name: Install browser for read-only official Support diagnosis
        # The live probe must look in the EXACT directory used at install time;
        # otherwise Playwright fails at launch and falsely blames the source.
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'ROCKSTAR_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
            echo 'Using preinstalled Google Chrome'
          else
            python -m playwright install --with-deps --only-shell chromium
          fi
      - name: Verify installed browser actually launches (local content, no network)
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from sources import _browser_launch_options
          try:
              with sync_playwright() as playwright:
                  options = _browser_launch_options()
                  browser = playwright.chromium.launch(**options)
                  try:
                      page = browser.new_page()
                      page.set_content('<main>browser-ready</main>')
                      assert page.locator('main').inner_text() == 'browser-ready'
                  finally:
                      browser.close()
              print('OFFICIAL_BROWSER_LAUNCH_OK channel=' + options.get('channel', 'chromium-shell'))
          except Exception as exc:
              raise SystemExit('OFFICIAL_BROWSER_LAUNCH_FAILED ' + type(exc).__name__) from None
          PY
      - name: Report live official Support reachability (never publish)
        # One capped diagnostic on PR; upstream access failures are explicit
        # INCONCLUSIVE results, not invented release notes or monitor success.
        # No Buffer/X token or bot state is used in this job.
        run: timeout 210s python rockstar_support_live_probe_v1.py
      - name: Test official general article index separately (read-only)
        run: timeout 95s python -c 'from rockstar_support_live_probe_v1 import probe_general_index; probe_general_index()'
