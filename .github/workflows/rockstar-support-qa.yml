name: Rockstar Support source regression QA

on:
  pull_request:
    paths:
      - 'sources.py'
      - 'sources.free.json'
      - 'test_rockstar_support_timeout.py'
      - '.github/workflows/rockstar-support-qa.yml'

permissions:
  contents: read

jobs:
  support-timeout-tests:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing free dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-free.txt
      - name: Compile and run Rockstar Support regression tests
        run: |
          python -m py_compile sources.py test_rockstar_support_timeout.py
          python -m unittest -q test_rockstar_support_timeout.py
