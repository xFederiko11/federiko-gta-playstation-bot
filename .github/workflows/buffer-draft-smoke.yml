
name: Buffer draft image and thread test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-smoke:
    name: Test Buffer draft only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_DRAFT_SMOKE_ONLY: '1'
      AUTO_PUBLISH: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-free.txt

      - name: Create test draft in Buffer
        run: python buffer_draft_smoke.py
