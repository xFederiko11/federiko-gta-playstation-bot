name: GTA Monitor gratuito

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '4/5 * 18-20 11 *'
      timezone: Europe/Berlin
    - cron: '9/10 * 21-22 11 *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      action:
        description: 'setup: trova il canale X; check: prova senza invii; run: esegue il bot'
        required: true
        default: check
        type: choice
        options:
          - setup
          - check
          - run

permissions:
  contents: write

concurrency:
  group: gta-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    # Standard hosted runners remain free for public repositories. Do not move
    # this workflow to a private repository or to a larger/paid runner.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      DATABASE: /tmp/gta-monitor.sqlite3
      ENCRYPTED_STATE: ${{ github.workspace }}/.state/bot.enc
      GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.action || 'check' }}
      BUFFER_EXPECTED_USERNAME: 'xFederiko11'
      BUFFER_PLAN: essentials
      BUFFER_PAID_THROUGH: '2026-12-15'
      INTELLIGENCE_V12_ENABLED: ${{ vars.INTELLIGENCE_V12_ENABLED || 'false' }}
      V12_UNIQUE_IMAGES: ${{ vars.V12_UNIQUE_IMAGES || 'false' }}
      WEEKLY_RADAR_V12_ENABLED: ${{ vars.WEEKLY_RADAR_V12_ENABLED || 'false' }}
      VIDEO_LINK_CARDS_V12: ${{ vars.VIDEO_LINK_CARDS_V12 || 'false' }}
      EDITORIAL_V13_ENABLED: ${{ vars.EDITORIAL_V13_ENABLED || 'false' }}
      EDITORIAL_V13_AUTOPUBLISH: ${{ vars.EDITORIAL_V13_AUTOPUBLISH || 'false' }}
    steps:
      - name: Seleziona la frequenza per la finestra del lancio 2026
        id: launch_window
        env:
          GITHUB_CRON: ${{ github.event.schedule }}
        run: |
          today="$(TZ=Europe/Berlin date +%Y-%m-%d)"
          active=false
          case "$GITHUB_CRON" in
            '4/5 * 18-20 11 *')
              case "$today" in
                2026-11-18|2026-11-19|2026-11-20) active=true ;;
              esac ;;
            '9/10 * 21-22 11 *')
              case "$today" in
                2026-11-21|2026-11-22) active=true ;;
              esac ;;
            '7,22,37,52 * * * *')
              case "$today" in
                2026-11-18|2026-11-19|2026-11-20|2026-11-21|2026-11-22) active=false ;;
                *) active=true ;;
              esac ;;
            *) active=true ;;
          esac
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Launch polling $today: active=$active (cron=$GITHUB_CRON)"
      - name: Leggi il progetto e lo stato cifrato
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Prepara Python gratuito
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-free.txt'
      - name: Installa il programma e il browser
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check -r requirements-free.txt
          python -m playwright install --with-deps chromium
      - name: Raccogli, prepara le schede e pubblica se attivato
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python online.py --once
      - name: Conserva il report ricerca v12 (nessuna pubblicazione)
        if: ${{ always() && steps.launch_window.outputs.active == 'true' && (vars.INTELLIGENCE_V12_ENABLED == 'true' || vars.WEEKLY_RADAR_V12_ENABLED == 'true' || vars.EDITORIAL_V13_ENABLED == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: ricerca-v12-${{ github.run_id }}
          path: |
            .runtime/intelligence-v12-report.json
            .runtime/weekly-radar-v12.json
            .runtime/editorial-v13-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Conserva lo stato e lo storico anche se una fonte fallisce
        if: ${{ always() && steps.launch_window.outputs.active == 'true' }}
        run: |
          if [ ! -d .git ]; then exit 0; fi
          if [ ! -f "$ENCRYPTED_STATE" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for item in .state/bot.enc history-public.json history-public.csv monitor-health.json; do
            if [ -f "$item" ]; then git add -- "$item"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted bot state and public download history'
          fi
          git pull --rebase origin "$GITHUB_BRANCH"
          git push origin "HEAD:$GITHUB_BRANCH"
