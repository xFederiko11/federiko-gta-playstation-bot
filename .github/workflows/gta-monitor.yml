name: GTA Monitor gratuito

on:
  # Verify source/runner changes on the deployed default branch, even if a
  # scheduled event is delayed. This event collects only, never sends to X.
  push:
    branches: [main]
    paths:
      - 'online.py'
      - 'state_health.py'
      - 'sources.py'
      - 'sources.free.json'
      - 'playstation_system.py'
      - '.github/workflows/gta-monitor.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '4/5 * 18-20 11 *'
      timezone: Europe/Berlin
    - cron: '9/10 * 21-22 11 *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      action:
        description: 'setup: trova il canale X; check: prova senza invii; run: esegue il bot'
        required: true
        default: check
        type: choice
        options:
          - setup
          - check
          - run

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gta-v142-qa-{0}', github.ref) || 'gta-v142-publication-global' }}
  cancel-in-progress: false

jobs:
  monitor:
    permissions:
      contents: write
    # Standard hosted runners remain free for public repositories. Do not move
    # this workflow to a private repository or to a larger/paid runner.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      DATABASE: /tmp/gta-monitor.sqlite3
      ENCRYPTED_STATE: ${{ github.workspace }}/.state/bot.enc
      GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      RUN_MODE: ${{ github.event_name == 'push' && 'collect' || github.event_name == 'schedule' && 'run' || inputs.action || 'check' }}
      BUFFER_EXPECTED_USERNAME: 'xFederiko11'
      BUFFER_PLAN: essentials
      BUFFER_PAID_THROUGH: '2026-12-15'
      INTELLIGENCE_V12_ENABLED: ${{ vars.INTELLIGENCE_V12_ENABLED || 'false' }}
      # Owner-requested: prevent repeated official logos/photos across monitor posts.
      V12_UNIQUE_IMAGES: 'true'
      WEEKLY_RADAR_V12_ENABLED: ${{ vars.WEEKLY_RADAR_V12_ENABLED || 'false' }}
      VIDEO_LINK_CARDS_V12: ${{ vars.VIDEO_LINK_CARDS_V12 || 'false' }}
      # No X API, no new subscription: official Rockstar YouTube share links.
      OFFICIAL_LINKS_FREE_ENABLED: 'true'
      EDITORIAL_V13_ENABLED: ${{ vars.EDITORIAL_V13_ENABLED || 'false' }}
      EDITORIAL_V13_AUTOPUBLISH: ${{ vars.EDITORIAL_V13_AUTOPUBLISH || 'false' }}
    steps:
      - name: Seleziona la frequenza per la finestra del lancio 2026
        id: launch_window
        env:
          GITHUB_CRON: ${{ github.event.schedule }}
        run: |
          today="$(TZ=Europe/Berlin date +%Y-%m-%d)"
          active=false
          case "$GITHUB_CRON" in
            '4/5 * 18-20 11 *')
              case "$today" in
                2026-11-18|2026-11-19|2026-11-20) active=true ;;
              esac ;;
            '9/10 * 21-22 11 *')
              case "$today" in
                2026-11-21|2026-11-22) active=true ;;
              esac ;;
            '7,22,37,52 * * * *')
              case "$today" in
                2026-11-18|2026-11-19|2026-11-20|2026-11-21|2026-11-22) active=false ;;
                *) active=true ;;
              esac ;;
            *) active=true ;;
          esac
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Launch polling $today: active=$active (cron=$GITHUB_CRON)"
      - name: Leggi il progetto e lo stato cifrato
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Prepara Python gratuito
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-free.txt'
      - name: Installa il programma e il browser
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check -r requirements-free.txt
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'ROCKSTAR_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
            echo 'Using preinstalled Google Chrome'
          else
            echo 'Preinstalled Chrome missing; using Playwright headless Chromium shell'
            python -m playwright install --with-deps --only-shell chromium
          fi
      - name: Verifica gratuita i link ufficiali prima di pubblicare
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        run: |
          python x_automation_safety_v1.py
          python -m unittest -q test_official_links_free_v140 test_patch_history_v1
      - name: Raccogli, prepara le schede e pubblica se attivato
        if: ${{ steps.launch_window.outputs.active == 'true' }}
        env:
          EDITORIAL_DIRECTOR_V142_ENABLED: 'true'
          GTA6_REQUIRE_ALL_POST_PHOTOS: 'true'
          BUFFER_API_KEY: ${{ github.event_name != 'push' && secrets.BUFFER_API_KEY || '' }}
          BUFFER_CHANNEL_ID: ${{ github.event_name != 'push' && secrets.BUFFER_CHANNEL_ID || '' }}
          STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python online.py --once
      - name: Conserva il report ricerca v12 (nessuna pubblicazione)
        if: ${{ always() && steps.launch_window.outputs.active == 'true' && (vars.INTELLIGENCE_V12_ENABLED == 'true' || vars.WEEKLY_RADAR_V12_ENABLED == 'true' || vars.EDITORIAL_V13_ENABLED == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ricerca-v12-${{ github.run_id }}
          path: |
            .runtime/intelligence-v12-report.json
            .runtime/weekly-radar-v12.json
            .runtime/editorial-v13-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Conserva lo stato e lo storico anche se una fonte fallisce
        if: ${{ always() && steps.launch_window.outputs.active == 'true' }}
        run: |
          if [ ! -d .git ]; then exit 0; fi
          if [ ! -f "$ENCRYPTED_STATE" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for item in .state/bot.enc .state/monitor-publication-v142.json history-public.json history-public.csv monitor-health.json; do
            if [ -f "$item" ]; then git add -- "$item"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted bot state and public download history'
          fi
          git pull --rebase origin "$GITHUB_BRANCH"
          git push origin "HEAD:$GITHUB_BRANCH"
