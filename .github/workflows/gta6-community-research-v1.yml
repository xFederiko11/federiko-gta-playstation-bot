name: GTA VI - Ricerca fonti indipendenti (sola lettura)

on:
  workflow_dispatch:
  schedule:
    # Nuove guide, walkthrough e articoli rilevati tre volte al giorno.
    - cron: '17 7,13,19 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'community_research_v1.py'
      - 'community-research-sources-v1.json'
      - 'test_community_research_v1.py'
      - 'community_editorial_queue_v1.py'
      - 'test_community_editorial_queue_v1.py'
      - '.github/workflows/gta6-community-research-v1.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: gta6-independent-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python pinned
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate community research code and sources
        run: |
          python -m py_compile community_research_v1.py community_editorial_queue_v1.py
          python community_research_v1.py --mode validate
          python -m unittest -q test_community_research_v1 test_community_editorial_queue_v1
      - name: Preview public sources (no Buffer, no posts)
        if: github.event_name != 'pull_request'
        run: |
          python community_research_v1.py --mode preview --output previews/community-research-digest.json
          echo "## GTA VI — fonti indipendenti (da verificare)" >> "$GITHUB_STEP_SUMMARY"
          echo "I risultati sono piste editoriali, non notizie confermate Rockstar." >> "$GITHUB_STEP_SUMMARY"
          echo "Nessun post Buffer e nessuna pubblicazione di articoli." >> "$GITHUB_STEP_SUMMARY"
          python community_editorial_queue_v1.py --input previews/community-research-digest.json --output previews/community-editorial-queue.md
      - name: Save research digest as review artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta6-community-research
          path: previews/community-research-digest.json
          retention-days: 7

      - name: Update persistent GitHub editorial queue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search 'in:title GTA VI - Coda fonti community' --json number,title --jq '.[] | select(.title == "GTA VI - Coda fonti community") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file previews/community-editorial-queue.md
            echo "Updated editorial issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "GTA VI - Coda fonti community" --body-file previews/community-editorial-queue.md
            echo "Created persistent editorial issue" >> "$GITHUB_STEP_SUMMARY"
          fi
