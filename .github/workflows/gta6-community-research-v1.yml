name: GTA VI - Ricerca fonti indipendenti (sola lettura)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta6-community-research-v1.yml'
      - 'community_research_v1.py'
      - 'community-research-sources-v1.json'
      - 'guide_evidence_review_v1.py'
      - 'guide_claim_evidence_gate.py'
  schedule:
    # Sei scansioni al giorno; indipendente da ChatGPT.
    - cron: '17 */4 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'community_research_v1.py'
      - 'community-research-sources-v1.json'
      - 'test_community_research_v1.py'
      - 'community_editorial_queue_v1.py'
      - 'test_community_editorial_queue_v1.py'
      - 'guide_evidence_review_v1.py'
      - 'test_guide_evidence_review_v1.py'
      - 'guide_claim_evidence_gate.py'
      - 'test_guide_claim_evidence_gate.py'
      - 'data/guide-claim-dossiers-v1.json'
      - '.github/workflows/gta6-community-research-v1.yml'

permissions:
  contents: read

concurrency:
  group: gta6-independent-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python pinned
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate community research code and sources
        run: |
          python -m py_compile community_research_v1.py community_editorial_queue_v1.py guide_evidence_review_v1.py guide_claim_evidence_gate.py
          python community_research_v1.py --mode validate
          python -m unittest -q test_community_research_v1 test_community_editorial_queue_v1 test_guide_evidence_review_v1 test_guide_claim_evidence_gate
      - name: Preview public sources (no Buffer, no posts)
        if: github.event_name != 'pull_request'
        run: |
          python community_research_v1.py --mode preview --output previews/community-research-digest.json
          echo "## GTA VI — fonti indipendenti (da verificare)" >> "$GITHUB_STEP_SUMMARY"
          echo "I risultati sono piste editoriali, non notizie confermate Rockstar." >> "$GITHUB_STEP_SUMMARY"
          echo "Nessun post Buffer e nessuna pubblicazione di articoli." >> "$GITHUB_STEP_SUMMARY"
          python community_editorial_queue_v1.py --input previews/community-research-digest.json --output previews/community-editorial-queue.md
          python guide_evidence_review_v1.py --input previews/community-research-digest.json --json previews/guide-review.json --markdown previews/guide-review.md
          cat previews/guide-review.md >> previews/community-editorial-queue.md
          python guide_claim_evidence_gate.py --input data/guide-claim-dossiers-v1.json --output previews/claim-gate-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("previews/claim-gate-review.json").read_text(encoding="utf-8"))
          ready=sum(x["editorially_reviewable"] for x in report["decisions"])
          path=Path("previews/community-editorial-queue.md")
          with path.open("a",encoding="utf-8") as file:
              file.write("\n## Dossier di verifiche PS5\n\n")
              file.write(f"{len(report['decisions'])} dossier controllati; {ready} pronti per **revisione editoriale**, non pubblicazione automatica.\n")
              file.write("Trofei, patch e piattaforma devono essere documentati separatamente. Le dichiarazioni di revisione sono dati inseriti nel repository, non prove verificate dal bot in modo autonomo.\n")
          print("CLAIM_GATE",len(report["decisions"]),"REVIEWABLE",ready,"AUTO_PUBLISH",False)
          PY
          echo 'Lista di revisione delle guide generata senza nuove affermazioni verificate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save research digest as review artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta6-community-research
          path: previews/
          retention-days: 7


  editorial_queue:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Download verified research artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gta6-community-research --dir previews
          test -s previews/community-editorial-queue.md
      - name: Update one persistent editorial GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search 'in:title GTA VI - Coda fonti community' --json number,title --jq '.[] | select(.title == "GTA VI - Coda fonti community") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file previews/community-editorial-queue.md
            echo "Updated editorial issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "GTA VI - Coda fonti community" --body-file previews/community-editorial-queue.md
            echo "Created persistent editorial issue" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect complete research feed outage
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("previews/community-research-digest.json").read_text(encoding="utf-8"))
          checked=report.get("sources_checked",[])
          if not checked or all(row.get("status")!="ok" for row in checked):
              raise SystemExit("ALL_RESEARCH_FEEDS_UNAVAILABLE: check source health in editorial issue")
          print("RESEARCH_HEALTH",sum(row.get("status")=="ok" for row in checked),"sources reachable")
          PY
