name: GTA VI News Center - Lancio cronologico v11

on:
  # Read-only verification of delivery. GitHub may delay these runs.
  schedule:
    - cron: '50 6 18 11 *'
      timezone: UTC
    - cron: '10,30 7 18 11 *'
      timezone: UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = report only; schedule = add timed posts to Buffer'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - schedule
          - audit
      confirm_queue:
        description: 'Required for schedule; confirm Buffer Queue 0 and Pause Queue enabled'
        required: true
        default: NO
        type: choice
        options:
          - NO
          - CONFIRMED_EMPTY_AND_PAUSED

permissions:
  contents: write

concurrency:
  group: gta6-editorial-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: GTA VI and PS5 official chronology preview or schedule
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'audit' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_EXPECTED_USERNAME: xFederiko11
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      GTA6_BOOTSTRAP_QUEUE: ${{ inputs.mode == 'schedule' && 'YES_QUEUE' || 'NO_QUEUE' }}
      CONFIRM_BUFFER_QUEUE_RESET: ${{ inputs.confirm_queue }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-free.txt
      - name: Preview editorial plan (safe, zero posts)
        if: ${{ inputs.mode == 'preview' }}
        run: python bootstrap_news_center.py --mode preview
      - name: Schedule verified topics (real Buffer posts)
        if: ${{ inputs.mode == 'schedule' && inputs.confirm_queue == 'CONFIRMED_EMPTY_AND_PAUSED' }}
        run: python bootstrap_news_center.py --mode schedule
      - name: Block incomplete scheduling confirmation
        if: ${{ inputs.mode == 'schedule' && inputs.confirm_queue != 'CONFIRMED_EMPTY_AND_PAUSED' }}
        run: |
          echo 'Refused: confirm Buffer queue is empty AND paused.' >&2
          exit 1

  audit:
    name: Read-only Buffer sent-status audit (no new post)
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit')) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
    steps:
      - name: Check UTC date for one-day campaign
        id: campaign
        run: |
          if [ "$(date -u +%Y-%m-%d)" = '2026-11-18' ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: ${{ steps.campaign.outputs.active == 'true' }}
        uses: actions/checkout@v4
      - name: Setup Python
        if: ${{ steps.campaign.outputs.active == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: ${{ steps.campaign.outputs.active == 'true' }}
        run: python -m pip install --disable-pip-version-check -r requirements-free.txt
      - name: Verify published delivery; report if missing
        if: ${{ steps.campaign.outputs.active == 'true' }}
        run: python bootstrap_news_center.py --mode audit
