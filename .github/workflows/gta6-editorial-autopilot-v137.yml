name: GTA VI - Editorial Autopilot v13.7

on:
  workflow_run:
    workflows: ["GTA Monitor gratuito"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "preview = read-only; run = attempt one fresh attributed story"
        type: choice
        options: [preview, run]
        required: true
        default: preview

permissions:
  contents: write

concurrency:
  group: gta-editorial-autopilot-v137
  cancel-in-progress: false

jobs:
  editorial:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        vars.AUTO_PUBLISH == 'true' &&
        vars.EDITORIAL_AUTOPILOT_V137_ENABLED != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_EXPECTED_USERNAME: xFederiko11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-free.txt
      - name: Install minimal dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate code
        run: python -m py_compile editorial_autopilot_v137.py buffer_publisher.py
      - name: Preview feeds without publication
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        run: python editorial_autopilot_v137.py --mode preview
      - name: Verify Buffer X destination before reservation
        if: github.event_name == 'workflow_run' || inputs.action == 'run'
        run: python editorial_autopilot_v137.py --mode preflight
      - name: Reserve one fresh item before any Buffer mutation
        id: reserve
        if: github.event_name == 'workflow_run' || inputs.action == 'run'
        run: |
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          python editorial_autopilot_v137.py --mode reserve
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .state/editorial-autopilot-v137.json ]; then
            git add -f .state/editorial-autopilot-v137.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve editorial v13.7 item before Buffer'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Deliver one reserved item to Buffer
        if: steps.reserve.outcome == 'success'
        run: python editorial_autopilot_v137.py --mode deliver
      - name: Persist Buffer outcome without automatic retry
        if: always() && steps.reserve.outcome == 'success'
        run: |
          if [ ! -f .state/editorial-autopilot-v137.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .state/editorial-autopilot-v137.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record editorial v13.7 Buffer delivery'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
