name: GTA VI - Editorial Autopilot v13.7

on:
  # Code quality checks on PRs never receive Buffer credentials or post anything.
  pull_request:
    branches: [main]
    paths:
      - 'editorial_language_it.py'
      - 'editorial_autopilot_v137.py'
      - 'editorial_seo_v135.py'
      - 'online.py'
      - 'video_cards_v12.py'
      - 'test_editorial_language_it.py'
      - 'test_editorial_autopilot_v137.py'
      - 'quick_tips_v146.py'
      - 'trophy_posts_v142.py'
      - 'portal_links_v148.py'
      - 'test_portal_links_v148.py'
      - 'test_quick_tips_v146.py'
      - 'editorial-calendar-v149.json'
      - 'legacy_pages_redirect_v149.py'
      - 'test_legacy_pages_redirect_v149.py'
      - 'buffer_failed_diagnostics_v147.py'
      - 'test_buffer_failed_diagnostics_v147.py'
      - 'README.md'
      - 'SECURITY.md'
      - 'test_official_links_free_v140.py'
      - '.github/workflows/gta-monitor.yml'
      - '.github/workflows/gta6-editorial-autopilot-v137.yml'
  workflow_run:
    workflows: ["GTA Monitor gratuito"]
    types: [completed]
  # Independent schedule: protects against delayed/missed upstream workflow_run events.
  schedule:
    - cron: '*/10 * 18-20 11 *'
    - cron: '7,27,47 * 21-30 11 *'
    - cron: '7,37 * 1-15 12 *'
  # Kick an immediate launch check when this workflow file is deployed to main.
  push:
    branches: [main]
    paths: ['.github/workflows/gta6-editorial-autopilot-v137.yml']
  workflow_dispatch:
    inputs:
      action:
        description: "preview = read-only; run = attempt one fresh attributed story"
        type: choice
        options: [preview, run]
        required: true
        default: preview

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gta-v142-qa-{0}', github.ref) || 'gta-v142-publication-global' }}
  cancel-in-progress: false

jobs:
  italian_qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-free.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Check Italian-only policy without publishing
        run: |
          python -m py_compile portal_links_v148.py editorial_director_v142.py trophy_posts_v142.py build_trophy_site_v142.py editorial_language_it.py editorial_autopilot_v137.py editorial_seo_v135.py online.py video_cards_v12.py quick_tips_v146.py
          python -m unittest discover -q

  editorial:
    permissions:
      contents: write
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch') ||
       ((github.event_name == 'schedule' || github.event_name == 'push') &&
        vars.AUTO_PUBLISH == 'true' &&
        vars.EDITORIAL_AUTOPILOT_V137_ENABLED != 'false') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        vars.AUTO_PUBLISH == 'true' &&
        vars.EDITORIAL_AUTOPILOT_V137_ENABLED != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_EXPECTED_USERNAME: xFederiko11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-free.txt
      - name: Install minimal dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate code
        run: |
          python -m py_compile editorial_language_it.py editorial_autopilot_v137.py editorial_seo_v135.py buffer_publisher.py video_cards_v12.py test_editorial_autopilot_v137.py test_editorial_language_it.py
          python -m unittest -q test_editorial_autopilot_v137 test_editorial_language_it test_official_links_free_v140 test_trophies_v142 test_editorial_director_v142 test_quick_tips_v146 test_portal_links_v148 test_buffer_failed_diagnostics_v147
      - name: Inspect last rejected Buffer thread (read-only)
        if: github.event_name == 'push'
        run: python buffer_failed_diagnostics_v147.py
      - name: Preview feeds without publication
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        run: python editorial_autopilot_v137.py --mode preview
      - name: Verify Buffer X destination before reservation
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'run')
        run: python editorial_autopilot_v137.py --mode preflight
      - name: Reserve one fresh item before any Buffer mutation
        id: reserve
        env:
          EDITORIAL_DIRECTOR_V142_ENABLED: 'true'
          GTA6_PORTAL_LINKS_ENABLED: 'true'
          TIPS_REAUTH_CONFIRMED_V149: ${{ vars.TIPS_REAUTH_CONFIRMED_V149 || 'false' }}
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'run')
        run: |
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          python editorial_autopilot_v137.py --mode reserve
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .state/editorial-autopilot-v137.json ]; then
            git add -f .state/editorial-autopilot-v137.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve editorial v13.7 item before Buffer'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Deliver one reserved item to Buffer
        if: steps.reserve.outcome == 'success'
        run: python editorial_autopilot_v137.py --mode deliver
      - name: Persist Buffer outcome without automatic retry
        if: always() && steps.reserve.outcome == 'success'
        run: |
          if [ ! -f .state/editorial-autopilot-v137.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .state/editorial-autopilot-v137.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record editorial v13.7 Buffer delivery'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
