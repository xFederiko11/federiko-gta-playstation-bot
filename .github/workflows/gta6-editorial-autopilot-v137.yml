name: GTA VI - Editorial Autopilot v13.7

on:
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements-free.txt'
      - 'photo-rights-review-v1.json'
      - 'editorial-calendar-v149.json'
      - 'site-article-rotation-v1.json'
      - '.github/workflows/gta-monitor.yml'
      - '.github/workflows/gta6-editorial-autopilot-v137.yml'
  # Buffer rate budget: seven attempts per day, spread > 120 minutes apart.
  # Former 34+ daily scheduled runs consumed many preflight API reads even
  # when no item was published. A confirmed official urgent news workflow
  # remains separate; never add filler posts to meet the daily goal.
  # GitHub's timezone-aware cron handles CET/CEST; Python remains final gate.
  schedule:
    - cron: '10 7 * * *'
      timezone: Europe/Rome
    - cron: '30 9 * * *'
      timezone: Europe/Rome
    - cron: '50 11 * * *'
      timezone: Europe/Rome
    - cron: '10 14 * * *'
      timezone: Europe/Rome
    - cron: '30 16 * * *'
      timezone: Europe/Rome
    - cron: '50 18 * * *'
      timezone: Europe/Rome
    - cron: '10 21 * * *'
      timezone: Europe/Rome
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements-free.txt'
      - 'editorial-calendar-v149.json'
      - 'site-article-rotation-v1.json'
      - 'photo-rights-review-v1.json'
      - '.github/workflows/gta-monitor.yml'
      - '.github/workflows/gta6-editorial-autopilot-v137.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "preview = read-only; run = attempt one fresh attributed story"
        type: choice
        options: [preview, run]
        required: true
        default: preview

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('gta-v142-qa-editorial-{0}', github.ref) || 'gta-v142-publication-global' }}
  cancel-in-progress: false

jobs:
  italian_qa:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-free.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Check Italian-only policy without publishing
        run: |
          python x_automation_safety_v1.py
          python -m py_compile social_media_gate_v2.py test_social_media_gate_v2.py buffer_failed_diagnostics_v147.py buffer_delivery_receipts_v1.py buffer_status_summary_v151.py portal_links_v148.py launch_cadence_v1.py quality_publish_policy_v1.py test_quality_publish_policy_v1.py growth_conversion_v1.py growth_social_desk_v2.py editorial_double_threads_v1.py editorial_director_v142.py trophy_posts_v142.py build_trophy_site_v142.py editorial_language_it.py editorial_autopilot_v137.py editorial_seo_v135.py online.py video_cards_v12.py quick_tips_v146.py
          env -u GITHUB_STEP_SUMMARY python -m unittest discover -q

  editorial:
    permissions:
      contents: write
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' &&
        vars.AUTO_PUBLISH == 'true' &&
        vars.EDITORIAL_AUTOPILOT_V137_ENABLED != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_EXPECTED_USERNAME: xFederiko11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-free.txt
      - name: Install minimal dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate code
        run: |
          python x_automation_safety_v1.py
          python -m py_compile social_media_gate_v2.py test_social_media_gate_v2.py owned_utm_attribution_v1.py buffer_failed_diagnostics_v147.py buffer_delivery_receipts_v1.py buffer_status_summary_v151.py launch_cadence_v1.py quality_publish_policy_v1.py test_quality_publish_policy_v1.py growth_conversion_v1.py editorial_double_threads_v1.py editorial_language_it.py editorial_autopilot_v137.py editorial_seo_v135.py buffer_publisher.py per_item_media_policy_v1.py test_per_item_media_policy_v1.py video_cards_v12.py test_editorial_autopilot_v137.py test_editorial_language_it.py
          env -u GITHUB_STEP_SUMMARY python -m unittest -q test_buffer_publisher test_official_media test_site_article_rotation_v1 test_social_media_gate_v2 test_buffer_delivery_receipts_v1 test_site_evergreen_posts_v1 test_vehicle_site_posts_v1 test_editorial_autopilot_v137 test_editorial_language_it test_official_links_free_v140 test_trophies_v142 test_editorial_director_v142 test_quick_tips_v146 test_portal_links_v148 test_buffer_failed_diagnostics_v147 test_buffer_status_summary_v151 test_launch_cadence_v1 test_quality_publish_policy_v1 test_editorial_double_threads_v1 test_growth_conversion_v1 test_owned_utm_attribution_v1 test_live_editorial_feed_v1 test_photo_rights_v1 test_per_item_media_policy_v1
      - name: Preview feeds without publication
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        run: python editorial_autopilot_v137.py --mode preview
      - name: Verify Buffer X destination before reservation
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'run')
        env:
          TIPS_REAUTH_CONFIRMED_V149: ${{ vars.TIPS_REAUTH_CONFIRMED_V149 || 'true' }}
        run: python buffer_status_summary_v151.py
      # Reviewed receipt: Buffer 6affa1e27b0a126ceb99ab72 sent at 2026-11-20T01:26:58.878Z.
      # https://twitter.com/xFederiko11/status/2123588882885186002
      # An explicit repository variable false still overrides this reviewed default.
      - name: Reserve one fresh item before any Buffer mutation
        id: reserve
        env:
          EDITORIAL_DIRECTOR_V142_ENABLED: 'true'
          GTA6_PORTAL_LINKS_ENABLED: 'true'
          TIPS_REAUTH_CONFIRMED_V149: ${{ vars.TIPS_REAUTH_CONFIRMED_V149 || 'true' }}
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'run')
        run: |
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          python editorial_autopilot_v137.py --mode reserve
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .state/editorial-autopilot-v137.json ]; then
            git add -f .state/editorial-autopilot-v137.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve editorial v13.7 item before Buffer'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Deliver one reserved item to Buffer
        if: steps.reserve.outcome == 'success'
        run: python editorial_autopilot_v137.py --mode deliver
      - name: Persist Buffer outcome without automatic retry
        if: always() && steps.reserve.outcome == 'success'
        run: |
          if [ ! -f .state/editorial-autopilot-v137.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .state/editorial-autopilot-v137.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record editorial v13.7 Buffer delivery'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Verify actual delivery receipt without retry
        if: always() && steps.reserve.outcome == 'success'
        run: python buffer_delivery_receipts_v1.py