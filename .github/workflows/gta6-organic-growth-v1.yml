name: GTA VI - Crescita X organica (solo bozze)

on:
  pull_request:
    branches: [main]
    paths:
      - 'organic_growth_v1.py'
      - 'test_organic_growth_v1.py'
      - 'editorial_autopilot_v137.py'
      - 'test_editorial_autopilot_v137.py'
      - 'growth_metrics_v142.py'
      - '.github/workflows/gta6-organic-growth-v1.yml'
  push:
    branches: [main]
    paths:
      - 'organic_growth_v1.py'
      - '.github/workflows/gta6-organic-growth-v1.yml'
  schedule:
    # Once daily; generates ideas, never calls X or Buffer.
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta6-organic-x-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  organic_growth:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python pinned
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Validate quality filter and organic growth plan (no publication)
        run: |
          python -m py_compile organic_growth_v1.py editorial_autopilot_v137.py growth_metrics_v142.py
          python -m unittest -q test_organic_growth_v1 test_editorial_autopilot_v137 test_growth_metrics_v142
      - name: Build original Italian manual-only content pack
        if: github.event_name != 'pull_request'
        run: |
          python organic_growth_v1.py --output previews/organic-growth-v1.md
          test -s previews/organic-growth-v1.md
          echo "GTA VI growth ideas generated without X or Buffer API calls" >> "$GITHUB_STEP_SUMMARY"
      - name: Save reviewed drafts as artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta6-organic-x-drafts
          path: previews/organic-growth-v1.md
          retention-days: 14
      - name: Maintain one persistent organic-growth GitHub Issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open \
            --search 'in:title GTA VI - Crescita organica X' \
            --json number,title \
            --jq '.[] | select(.title == "GTA VI - Crescita organica X") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file previews/organic-growth-v1.md
            echo "Updated organic-growth Issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title 'GTA VI - Crescita organica X' \
              --body-file previews/organic-growth-v1.md
            echo "Created persistent organic-growth Issue" >> "$GITHUB_STEP_SUMMARY"
          fi
