name: GTA VI - X Social Radar verificato (solo bozze)

on:
  pull_request:
    branches: [main]
    paths:
      - 'x_verified_social_radar_v1.py'
      - 'growth_social_desk_v2.py'
      - 'test_x_verified_social_radar_v1.py'
      - 'x_free_public_embed_scout_v1.py'
      - 'test_x_free_public_embed_scout_v1.py'
      - 'editorial-autopilot-v137-sources.json'
      - '.github/workflows/gta6-x-verified-social-radar-v1.yml'
      - 'X-COMMUNITY-SAFETY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta6-x-verified-social-radar-v1.yml'
      - 'x_free_public_embed_scout_v1.py'
  schedule:
    # Morning official API only with explicit user opt-in; no paid calls in later runs.
    - cron: '17 7 * * *'
    # Extra public RSS + official oEmbed sweeps, read-only and free.
    - cron: '17 12,17 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'preview = no API charges; run = query only if explicitly enabled'
        required: true
        default: preview
        type: choice
        options: [preview, run]

permissions:
  contents: read

concurrency:
  group: gta6-x-social-radar-verified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  social_radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing free monitoring dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Run offline X API schema, compliance and editorial tests
        run: |
          python -m py_compile x_verified_social_radar_v1.py test_x_verified_social_radar_v1.py x_free_public_embed_scout_v1.py test_x_free_public_embed_scout_v1.py
          python -m unittest -q test_x_verified_social_radar_v1 test_x_free_public_embed_scout_v1
      - name: Load old tweet IDs from persistent issue, no X API cost
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.action == 'run')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .runtime
          gh issue view 48 --json body --jq '.body' > .runtime/previous-social-radar.md || true
      - name: Make a daily report without automatic social interactions
        if: github.event_name != 'pull_request'
        env:
          # Require both active billing opt-in AND a scheduled/manual run.
          X_SOCIAL_RADAR_ENABLED: ${{ ((github.event_name == 'schedule' && github.event.schedule == '17 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'run')) && vars.X_SOCIAL_RADAR_ENABLED || 'false' }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python x_verified_social_radar_v1.py --output previews/verified-x-social-radar-v1.md --previous-report .runtime/previous-social-radar.md
          test -s previews/verified-x-social-radar-v1.md
          echo 'GTA VI radar: X API read-only, reply links manual only.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save human-review digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta6-x-social-radar-review
          path: previews/verified-x-social-radar-v1.md
          retention-days: 7
      - name: Maintain a single Social Radar issue without spamming GitHub
        if: (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'run')) && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Issue #48 was created at installation; never spawn duplicates.
          gh issue edit 48 --body-file previews/verified-x-social-radar-v1.md
          echo "Updated verified X Social Radar issue #48" >> "$GITHUB_STEP_SUMMARY"
