name: GTA VI - GTA+ e Gallerie ufficiali v13.9

on:
  pull_request:
    branches: [main]
    paths: ['gta6_special_campaign_v139.py', 'test_gta6_special_campaign_v139.py', 'buffer_publisher.py', '.github/workflows/gta6-special-campaign-v139.yml']
  push:
    branches: [main]
    paths: ['gta6_special_campaign_v139.py', '.github/workflows/gta6-special-campaign-v139.yml']
  schedule:
    - cron: '9,29,49 * 18-20 11 *'
  workflow_dispatch:
    inputs:
      action:
        description: 'preview = sola lettura; run = un post se pronto'
        required: true
        default: preview
        type: choice
        options: [preview, run]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gta-v142-qa-{0}', github.ref) || 'gta-v142-publication-global' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Offline tests, no Buffer secrets
        run: |
          python x_automation_safety_v1.py
          python -m py_compile gta6_special_campaign_v139.py buffer_publisher.py
          python -m unittest -q test_gta6_special_campaign_v139 test_buffer_publisher

  deliver:
    permissions:
      contents: write
    if: >-
      github.event.repository.private == false &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_EXPECTED_USERNAME: xFederiko11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-free.txt
      - name: Verify tests before any Buffer write
        run: |
          python x_automation_safety_v1.py
          python -m py_compile gta6_special_campaign_v139.py buffer_publisher.py
          python -m unittest -q test_gta6_special_campaign_v139 test_buffer_publisher
      - name: Preview only
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        run: python gta6_special_campaign_v139.py --mode preview
      - name: Reserve one campaign item before posting
        id: reserve
        env:
          EDITORIAL_DIRECTOR_V142_ENABLED: 'true'
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'run'
        run: |
          git pull --rebase origin main
          python gta6_special_campaign_v139.py --mode reserve
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .state/special-campaign-v139.json ]; then
            git add -f .state/special-campaign-v139.json
            if ! git diff --cached --quiet; then
              git commit -m 'Reserve GTA VI special post before Buffer'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Deliver reserved post once
        if: steps.reserve.outcome == 'success'
        run: python gta6_special_campaign_v139.py --mode deliver
      - name: Persist outcome without retry
        if: always() && steps.reserve.outcome == 'success'
        run: |
          if [ ! -f .state/special-campaign-v139.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .state/special-campaign-v139.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record GTA VI special campaign delivery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
